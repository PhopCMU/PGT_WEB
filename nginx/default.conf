server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # SPA fallback (สำคัญมาก)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset cache
    location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
