server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # 1. ป้องกันการ Cache index.html เพื่อให้ Browser เช็คไฟล์ใหม่เสมอ
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # 2. ป้องกันการ Cache Service Worker และ Manifest
    # สำคัญมากสำหรับ PWA: ไฟล์เหล่านี้ห้ามค้างใน Cache ของ Browser
    location ~* (sw\.js|service-worker\.js|manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    # 3. Static assets ที่มี Hash ต่อท้าย (Vite assets) สามารถ Cache ยาวได้
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. ไฟล์ Static ทั่วไปอื่นๆ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        # ถ้าไฟล์มี Hash ในชื่อ (Vite) จะไปเข้าข้อ /assets/ ด้านบนก่อนอยู่แล้ว
        # ข้อนี้จะเก็บตกพวกรูปภาพใน public/ หรือไฟล์ที่ไม่มี hash
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}

